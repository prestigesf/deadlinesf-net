<style>
  :root{
    color-scheme:dark;
    --bg:#050508; --panel:rgba(17,17,17,.78); --line:#2a2a2a;
    --ink:#f5f5f0; --mute:#8a8a82;
    --red:#FF2B2B; --alert:#ff4d2e; --signal:#46e6a0; --amber:#ffb627;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;background:#050508}
  body{background:transparent;color:var(--ink);font-family:var(--disp);line-height:1.45;-webkit-font-smoothing:antialiased;position:relative}
  #water{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .site{position:relative;z-index:1}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  a{color:inherit}
  ::selection{background:rgba(255,43,43,.85);color:#fff}
  .r{color:var(--red);transition:text-shadow .2s ease,filter .2s ease}
  .r:hover{filter:brightness(1.3);text-shadow:0 0 6px var(--red),0 0 18px var(--red),0 0 42px rgba(255,43,43,.65);animation:deadlineFlare 1.05s ease-in-out infinite}
  .logo:hover{color:var(--red);text-shadow:0 0 7px rgba(255,43,43,.55)}
  .logo:hover .r{filter:brightness(1.4);text-shadow:0 0 8px var(--red),0 0 24px var(--red),0 0 55px rgba(255,43,43,.85)}
  @keyframes deadlineFlare{0%,100%{text-shadow:0 0 6px var(--red),0 0 18px var(--red),0 0 42px rgba(255,43,43,.55)}50%{text-shadow:0 0 11px var(--red),0 0 32px var(--red),0 0 75px rgba(255,43,43,.9)}}
  .hw{display:inline;transition:color .14s ease,text-shadow .18s ease;border-radius:2px}
  .hw:hover{color:var(--red)!important;text-shadow:0 0 8px rgba(255,43,43,.55),0 0 22px rgba(255,43,43,.35),0 0 48px rgba(255,43,43,.18)}
  h1 .hw:hover,h2 .hw:hover{text-shadow:0 0 10px rgba(255,43,43,.7),0 0 28px rgba(255,43,43,.45)}
  @media (prefers-reduced-motion:reduce){.r:hover{animation:none}.hw,.hw:hover{transition:none}}
  .statusbar{border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute);display:flex;justify-content:space-between;align-items:center;padding:10px 24px;flex-wrap:wrap;gap:8px;background:rgba(5,5,8,.5);backdrop-filter:blur(10px)}
  .statusbar .live{color:var(--red)}
  .blink{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  nav{border-bottom:1px solid var(--line);padding:16px 0;background:rgba(5,5,8,.4);backdrop-filter:blur(8px)}
  nav .row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:var(--mono);font-weight:700;letter-spacing:.05em;font-size:14px;transition:color .2s ease,text-shadow .2s ease}
  .navlinks{display:flex;gap:22px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .navlinks a{text-decoration:none}
  .navlinks a:hover{color:var(--ink)}
  .btn{display:inline-block;padding:12px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid var(--red);color:var(--ink);background:var(--red);font-weight:700}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn:hover{filter:brightness(1.1)}
  .hero{padding:32px 0 48px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:24px}
  h1{font-weight:900;font-size:clamp(38px,8vw,88px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:20px}
  h1 .thin{font-weight:600;color:var(--mute)}
  .lede{font-size:clamp(17px,2.2vw,21px);color:var(--ink);max-width:64ch;margin-bottom:14px}
  .sub{font-size:15px;color:var(--mute);max-width:64ch;margin-bottom:32px}
  .ctarow{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
  .clock{margin:48px 0 8px;border:1px solid var(--line);background:var(--panel)}
  .clock-head{border-bottom:1px solid var(--line);padding:12px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .unit{padding:28px 12px;text-align:center;border-right:1px solid var(--line)}
  .unit:last-child{border-right:none}
  .num{font-family:var(--mono);font-weight:700;font-size:clamp(34px,7vw,64px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:10px}
  .clock-foot{border-top:1px solid var(--line);padding:12px 20px;font-family:var(--mono);font-size:12px;color:var(--mute)}
  .clock-foot b{color:var(--amber);font-weight:700}
  .clock{position:relative;overflow:hidden;background:linear-gradient(180deg,#1c0d0d,var(--panel) 62%);box-shadow:0 0 0 1px rgba(255,43,43,.3),0 24px 66px rgba(0,0,0,.62),0 0 70px rgba(255,43,43,.2);animation:clockGlow 3.4s ease-in-out infinite}
  .clock>*{position:relative;z-index:1}
  .clock::before{content:"";position:absolute;top:0;left:-55%;width:55%;height:3px;background:linear-gradient(90deg,transparent,var(--red),#fff,var(--red),transparent);box-shadow:0 0 12px var(--red);animation:clockSweep 1.8s linear infinite;z-index:3;pointer-events:none}
  .clock::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,43,43,.22),transparent 72%);animation:clockBeat 1s ease-out infinite}
  .clock .num{font-size:clamp(44px,9vw,86px);text-shadow:0 0 12px rgba(255,43,43,.45),0 0 30px rgba(255,43,43,.2)}
  .clock #s{color:var(--red);animation:secBeat 1s ease-in-out infinite}
  @keyframes clockGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,43,43,.25),0 24px 66px rgba(0,0,0,.62),0 0 60px rgba(255,43,43,.16)}50%{box-shadow:0 0 0 1px rgba(255,43,43,.6),0 24px 78px rgba(0,0,0,.68),0 0 110px rgba(255,43,43,.38)}}
  @keyframes clockSweep{0%{left:-55%}100%{left:100%}}
  @keyframes clockBeat{0%{opacity:1}22%{opacity:.8}100%{opacity:.08}}
  @keyframes secBeat{0%,100%{transform:scale(1);text-shadow:0 0 10px var(--red),0 0 26px rgba(255,43,43,.5)}50%{transform:scale(1.08);text-shadow:0 0 18px var(--red),0 0 44px rgba(255,43,43,.95)}}
  @media (prefers-reduced-motion:reduce){.clock,.clock::before,.clock::after,.clock #s{animation:none}.clock::after{opacity:.18}}
  .btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 22px rgba(255,43,43,.5);filter:brightness(1.08)}
  .btn.ghost:hover{border-color:var(--red);box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 16px rgba(255,43,43,.3);filter:none}
  .tier{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
  .tier:hover{transform:translateY(-5px);border-color:var(--red);box-shadow:0 18px 42px rgba(0,0,0,.55),0 0 28px rgba(255,43,43,.22)}
  .part{position:relative;transition:box-shadow .2s ease,background .2s ease}
  .part:hover{background:#160c0c;box-shadow:inset 0 0 0 1px var(--red),0 0 26px rgba(255,43,43,.16);z-index:1}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.btn:hover,.tier:hover{transform:none}.reveal{opacity:1;transform:none;transition:none}}
  section{padding:64px 0;border-bottom:1px solid var(--line)}
  .sec-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:16px}
  h2{font-weight:800;font-size:clamp(26px,4vw,42px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:28px}
  h3{font-weight:700;font-size:19px;margin-bottom:8px;letter-spacing:-.01em}
  p.body{color:var(--mute);font-size:16px;max-width:66ch;margin-bottom:16px}
  p.body b{color:var(--ink)}
  .laws{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
  .law{padding:28px;border-right:1px solid var(--line)}

  .law .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  .law.hot .tag{color:var(--red)}
  .law.now .tag{color:var(--amber)}
  .law.next .tag{color:var(--signal)}
  .law h3{font-size:22px;margin-bottom:6px}

  .law p{color:var(--mute);font-size:14px}

  .tiers{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .tier{border:1px solid var(--line);padding:28px;background:var(--panel);display:flex;flex-direction:column}
  .tier.featured{border-color:var(--red)}
  .tier .tname{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}

  .tier h3{font-size:28px;margin-bottom:6px}
  .tier .price{font-family:var(--mono);font-weight:700;font-size:32px;margin:12px 0 4px}

  .tier li::before{content:"›";position:absolute;left:0;color:var(--red);font-family:var(--mono);font-weight:700}
  .tier .btnrow{margin-top:auto}
  .authority{border:1px solid var(--line);background:rgba(5,5,8,.55);padding:18px;margin-bottom:22px}
  .authority .ahead{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .authority .atitle{font-family:var(--mono);font-size:13px;line-height:1.4;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);font-weight:700}
  .authority .asub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-top:6px}
  .authority .adisc{border-left:3px solid var(--amber);padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:var(--mute)}
  .agrid{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line)}
  .aclass{padding:14px 16px;border-bottom:1px solid var(--line)}
  .aclass:last-child{border-bottom:none}
  .aclass .an{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .aclass p{font-size:13px;line-height:1.6;color:var(--mute)}
  .atag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line)}
  .aclass.block .atag{color:var(--red);border-color:var(--red)}
  .aclass.review .atag{color:var(--amber);border-color:var(--amber)}
  .aclass.harden .atag{color:var(--signal);border-color:var(--signal)}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line)}
  .step{padding:24px;border-right:1px solid var(--line)}
  .step:last-child{border-right:none}
  .step .n{font-family:var(--mono);font-weight:700;color:var(--red);font-size:14px;margin-bottom:10px}
  .step h4{font-size:16px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
  .step p{font-size:13px;color:var(--mute)}
  form{border:1px solid var(--line);padding:28px;background:var(--panel);max-width:600px}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  input,select,textarea{width:100%;padding:13px 14px;background:linear-gradient(180deg,#20130f,#141414 58%);border:1px solid var(--line);border-top-color:#3d2a28;color:var(--ink);font-family:var(--disp);font-size:15px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 26px rgba(0,0,0,.6),0 0 26px rgba(255,43,43,.11);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  input:hover,select:hover,textarea:hover{transform:translateY(-3px);border-top-color:#5a3634;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 36px rgba(0,0,0,.66),0 0 42px rgba(255,43,43,.22)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 22px 44px rgba(0,0,0,.72),0 0 0 1px var(--red),0 0 34px rgba(255,43,43,.45)}
  @media (prefers-reduced-motion:reduce){input,select,textarea{transition:box-shadow .18s ease,border-color .18s ease}input:hover,select:hover,textarea:hover,input:focus,select:focus,textarea:focus{transform:none}}
  form button{width:100%}
  details{border:1px solid var(--line);padding:16px 20px;margin-bottom:8px;background:var(--panel)}
  details summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details[open] summary{color:var(--red);margin-bottom:10px}
  details p{color:var(--mute);font-size:14px}
  .plane{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
  .part{padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

  .part:nth-last-child(-n+3){border-bottom:none}
